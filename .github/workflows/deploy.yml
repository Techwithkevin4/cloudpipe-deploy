
name: Deploy CloudPipe Website

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Inspect GitHub OIDC claims
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('sts.amazonaws.com');
            const payload = JSON.parse(
              Buffer.from(token.split('.')[1], 'base64url').toString()
            );
            core.info(`Audience: ${payload.aud}`);
            core.info(`Subject: ${payload.sub}`);
            core.info(`Issuer: ${payload.iss}`);

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-2
          role-session-name: CloudPipeGitHubActions

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Deploy website to S3
        run: |
          aws s3 sync ./website/ \
            s3://cloudpipe-stack-websitebucket-ztlf3d3as63y/ \
            --delete

      - name: Deployment successful
        run: echo "CloudPipe website deployed successfully!"

